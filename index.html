<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>誠屏 EPB-1001 電池監控平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: fixed petrol sidebar + scrolling work area; summary tiles on top, detail below; one slide-in drawer per battery module. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f5f8f8; --ink:#0e1b1e; --ink-2:#465659; --ink-3:#6f8186;
  --line:#dbe3e5; --line-2:#c6d2d5;
  --accent:#0c6473; --accent-ink:#ffffff; --accent-soft:#e0eef0;
  --side:#0d2a31; --side-ink:#d3e6ea; --side-ink-2:#8eb0b7; --side-active:#174550;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --off:#8a979a;
  --good-soft:#e2f3e2; --warn-soft:#fff2d3; --crit-soft:#fbe4e4; --off-soft:#e9eeef;
  --good-ink:#096609; --warn-ink:#7f5300; --crit-ink:#a32323; --off-ink:#4f5d60;
  --s1:#2a78d6; --s2:#eb6834;
  --font:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1113; --surface:#111a1d; --surface-2:#162226; --ink:#e5eef0; --ink-2:#a5b5b9; --ink-3:#7a8d92;
    --line:#213034; --line-2:#2c3e43;
    --accent:#47b4c3; --accent-ink:#04171b; --accent-soft:#12323a;
    --side:#07181c; --side-ink:#d3e6ea; --side-ink-2:#7fa1a8; --side-active:#123942;
    --good-soft:#12301a; --warn-soft:#3a2c0c; --crit-soft:#3b1717; --off-soft:#1c282b;
    --good-ink:#62d462; --warn-ink:#f7c14f; --crit-ink:#f28585; --off-ink:#a9b6b9;
    --s1:#3987e5; --s2:#d95926;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1113; --surface:#111a1d; --surface-2:#162226; --ink:#e5eef0; --ink-2:#a5b5b9; --ink-3:#7a8d92;
  --line:#213034; --line-2:#2c3e43;
  --accent:#47b4c3; --accent-ink:#04171b; --accent-soft:#12323a;
  --side:#07181c; --side-ink:#d3e6ea; --side-ink-2:#7fa1a8; --side-active:#123942;
  --good-soft:#12301a; --warn-soft:#3a2c0c; --crit-soft:#3b1717; --off-soft:#1c282b;
  --good-ink:#62d462; --warn-ink:#f7c14f; --crit-ink:#f28585; --off-ink:#a9b6b9;
  --s1:#3987e5; --s2:#d95926;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:12px;color:var(--side-ink-2)}
.brand .co{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:12px;color:var(--side-ink)}
.brand .co i{width:8px;height:8px;border-radius:50%;background:#3fd17d;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px}
.nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff}
.nav a .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;border-radius:10px;padding:0 7px;line-height:18px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--side-ink-2);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.demo-chip{display:inline-flex;align-items:center;gap:6px;border:1px dashed rgba(255,255,255,.25);border-radius:6px;padding:3px 8px;color:var(--side-ink);width:max-content}

.main{overflow-y:auto;height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.top h1{font-size:19px}
.top .sub{font-size:12.5px;color:var(--ink-3)}
.top .tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}*{transition:none!important}}
.sel,.inp{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;height:34px}
.inp{min-width:0}
.sel:hover,.inp:hover{border-color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
a.lnk,button.lnk{color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;font-weight:500}

.view{display:none;padding:20px 24px 40px;flex-direction:column;gap:16px}
.view.on{display:flex}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card>header h2{font-size:15px}
.card>header .hint{font-size:12.5px;color:var(--ink-3)}
.card>header .r{margin-left:auto;display:flex;gap:8px;align-items:center}

.kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:14px 16px 14px 18px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.kpi.k-good::before{background:var(--good)} .kpi.k-warn::before{background:var(--warn)} .kpi.k-crit::before{background:var(--crit)} .kpi.k-acc::before{background:var(--accent)}
.kpi .lbl{font-size:12.5px;color:var(--ink-2)}
.kpi .val{font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .val small{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:2px}
.kpi .foot{font-size:12px;color:var(--ink-3)}
.kpi button.kpi-link{all:unset;cursor:pointer;position:absolute;inset:0;border-radius:var(--r)}
.kpi button.kpi-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kpi:has(.kpi-link):hover{border-color:var(--line-2);background:var(--surface-2)}
.delta-down{color:var(--crit-ink)} .delta-up{color:var(--good-ink)}

/* status pills: shape + label, never color alone */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 8px;border-radius:20px;white-space:nowrap;line-height:18px}
.pill::before{content:"";width:8px;height:8px;flex:none}
.pill.good{background:var(--good-soft);color:var(--good-ink)} .pill.good::before{background:var(--good);border-radius:50%}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)} .pill.warn::before{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%);width:10px;height:9px}
.pill.crit{background:var(--crit-soft);color:var(--crit-ink)} .pill.crit::before{background:var(--crit);border-radius:1px}
.pill.off{background:var(--off-soft);color:var(--off-ink)} .pill.off::before{background:var(--off);border-radius:50%;box-shadow:inset 0 0 0 2px var(--off-soft)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.veto{background:var(--crit-soft);border-color:transparent;color:var(--crit-ink);font-weight:600}
.st-ic{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.st-ic svg{width:13px;height:13px;flex:none}
.st-ic.chg svg{fill:var(--s1);stroke:none} .st-ic.dis svg{fill:none;stroke:var(--s2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.st-ic.idle svg{fill:none;stroke:var(--ink-3);stroke-width:2.4;stroke-linecap:round} .st-ic.off svg{fill:none;stroke:var(--off);stroke-width:2;stroke-linecap:round}

/* priority risk list */
.risk{display:flex;flex-direction:column}
.risk li{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.risk li:first-child{border-top:0}
.risk .rk{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:center}
.risk .t{display:flex;flex-direction:column;min-width:0}
.risk .t b{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.risk .t span{font-size:12.5px;color:var(--ink-2)}
ul.risk{margin:0;padding:0}

/* distribution bar */
.dist{display:flex;height:26px;gap:2px;border-radius:6px;overflow:hidden}
.dist>div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;min-width:22px}
.dist .d-good{background:var(--good)} .dist .d-warn{background:var(--warn);color:#3b2800} .dist .d-crit{background:var(--crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.site-rows{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.site-row{display:grid;grid-template-columns:92px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px}
.site-row .dist{height:14px;border-radius:4px}
.site-row .dist>div{font-size:0;min-width:3px}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ops div{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.ops b{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.sect-lbl{font-size:12px;color:var(--ink-3);margin:14px 0 8px;font-weight:500}

/* battery wall */
.wall-site{display:flex;flex-direction:column;gap:8px}
.wall-site+.wall-site{margin-top:16px}
.wall-site h3{font-size:13px;color:var(--ink-2);font-weight:600;display:flex;gap:8px;align-items:baseline}
.wall-site h3 span{font-weight:400;color:var(--ink-3)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.dev{border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.dev .dh{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink-3);padding:0 2px}
.dev .dh b{color:var(--ink);font-family:var(--mono);font-weight:500}
.dev .dh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mod{all:unset;cursor:pointer;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 9px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mod:hover{border-color:var(--ink-3)}
.mod:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--good)}
.mod.warn::before{background:var(--warn)} .mod.crit::before{background:var(--crit)}
.mod .mt{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-3)}
.mod .mt .shape{width:8px;height:8px;background:var(--good);border-radius:50%}
.mod.warn .mt .shape{background:var(--warn);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);width:9px}
.mod.crit .mt .shape{background:var(--crit);border-radius:1px}
.mod .soc{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.mod .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.mod .bar i{display:block;height:100%;background:var(--ink-3);border-radius:2px}
.mod .mb{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mod.offl .soc{color:var(--ink-3)}

/* alerts feed */
.feed{display:flex;flex-direction:column;margin:0;padding:0}
.feed li{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:9px 2px;border-top:1px solid var(--line);align-items:start;font-size:13px}
.feed li:first-child{border-top:0}
.feed .when{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.sev{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.sev.crit{background:var(--crit-soft);color:var(--crit-ink)} .sev.warn{background:var(--warn-soft);color:var(--warn-ink)} .sev.info{background:var(--accent-soft);color:var(--accent)}
.feed .new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--accent)}
th[aria-sort] button{color:var(--ink)}
.scorebar{display:flex;align-items:center;gap:8px;min-width:120px}
.scorebar .trk{flex:1;height:6px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.scorebar .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.scorebar b{font-variant-numeric:tabular-nums;width:24px;text-align:right;font-weight:600}
.socbar{display:flex;align-items:center;gap:6px;min-width:84px}
.socbar .trk{width:44px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.socbar .trk i{display:block;height:100%;background:var(--ink-3)}
.idcell{font-family:var(--mono);font-weight:500;white-space:nowrap}
.sub2{font-size:12px;color:var(--ink-3)}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 220px;max-width:320px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search input{width:100%;padding-left:32px}
.count{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.pager{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.pager button{min-width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.pager button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;height:30px;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* heatmap */
.hm{display:grid;gap:2px;font-size:11.5px;overflow-x:auto}
.hm .hc{height:28px;border-radius:3px;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:600;min-width:46px}
.hm .hh{color:var(--ink-3);font-size:11px;text-align:center;padding:0 2px 4px;line-height:1.25;align-self:end}
.hm .hr{font-family:var(--mono);font-size:12px;display:flex;align-items:center;padding-right:8px;white-space:nowrap}
.hm .hr button{all:unset;cursor:pointer;color:var(--ink)}
.hm .hr button:hover{color:var(--accent);text-decoration:underline}
.b-good{background:var(--good-soft);color:var(--good-ink)}
.b-warn{background:var(--warn);color:#3b2800}
.b-crit{background:var(--crit);color:#fff}
.b-mid{background:color-mix(in srgb,var(--warn) 35%,var(--surface));color:var(--warn-ink)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.drawer .dhd{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:flex-start}
.drawer .dhd h2{font-size:18px;font-family:var(--mono);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drawer .dhd .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.drawer .dbody{overflow-y:auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:14px}
.x{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px;stroke:var(--ink-2);stroke-width:2;fill:none;stroke-linecap:round}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.bigscore{display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;border-radius:50%;border:6px solid var(--good)}
.bigscore.warn{border-color:var(--warn)} .bigscore.crit{border-color:var(--crit)}
.bigscore b{font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bigscore span{font-size:11px;color:var(--ink-3)}

<script>
'use strict';
/* ============================================================
   Utilities
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(20261109);
const rand = (a, b) => a + R() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0 = v => Math.round(v).toString();
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const f2 = v => (Math.round(v * 100) / 100).toFixed(2);
function lerpMap(v, pts){
  if (v <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++){
    if (v <= pts[i][0]){ const [x0, y0] = pts[i-1], [x1, y1] = pts[i]; return y0 + (y1 - y0) * (v - x0) / (x1 - x0); }
  }
  return pts[pts.length - 1][1];
}
const NOW0 = new Date();
const DAY = 864e5;
const pad2 = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`;
const fmtDT = d => `${pad2(d.getMonth()+1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function ago(ts){
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return '剛剛';
  if (s < 3600) return `${Math.floor(s/60)} 分鐘前`;
  if (s < 86400) return `${Math.floor(s/3600)} 小時前`;
  return `${Math.floor(s/86400)} 天前`;
}
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };

/* ============================================================
   Domain model — EPB-1001 dual-module NMC pack on HID-2340
   ============================================================ */
const RATED_AH = 6.46;      // measured full capacity in the POC
const SITES = [
  {id:'A', name:'北區醫學中心', short:'北區', amb:26, n:16, wards:['急診部','加護病房 ICU','手術室','7F 內科病房','門診護理站']},
  {id:'B', name:'中區教學醫院', short:'中區', amb:27, n:14, wards:['急診部','10F 外科病房','血液透析室','產房','藥劑部']},
  {id:'C', name:'南區區域醫院', short:'南區', amb:28, n:10, wards:['急診部','加護病房 ICU','5F 綜合病房','復健科']},
];
const SITE = Object.fromEntries(SITES.map(s => [s.id, s]));
const IND = [
  {k:'cap',     name:'容量衰退',     unit:'%',   w:.22, fmt:v=>f1(v)+'%',    desc:'FullChargeCapacity ÷ 額定容量（SOH）'},
  {k:'ir',      name:'內阻代理值',   unit:'mΩ',  w:.18, fmt:v=>f0(v)+' mΩ',  desc:'靜置與負載電壓差 ÷ 負載電流'},
  {k:'thermal', name:'熱行為',       unit:'°C',  w:.16, fmt:v=>f1(v)+' °C',  desc:'充放電峰值溫度'},
  {k:'soc',     name:'SOC 一致性',   unit:'pt',  w:.10, fmt:v=>(v>=0?'+':'')+f1(v)+' pt', desc:'BMS SOC 對比獨立庫倫計數'},
  {k:'cv',      name:'充電終止曲線', unit:'min', w:.12, fmt:v=>'CV '+f0(v)+' 分', desc:'CC→CV 收斂時間（正常 35–38 分）'},
  {k:'sym',     name:'雙模組對稱性', unit:'%',   w:.10, fmt:v=>f1(v)+'%',    desc:'B1／B2 電流分配差異'},
  {k:'ce',      name:'庫倫效率',     unit:'%',   w:.12, fmt:v=>f1(v)+'%',    desc:'放電 Ah ÷ 充電 Ah'},
];
const INDK = Object.fromEntries(IND.map(i => [i.k, i]));
const SUB = {
  cap:     v => lerpMap(v, [[75,5],[80,40],[90,80],[97,100]]),
  ir:      v => lerpMap(v, [[135,100],[160,60],[190,30],[220,5]]),
  thermal: v => lerpMap(v, [[38,100],[42,65],[45,35],[48,5]]),
  soc:     v => lerpMap(Math.abs(v), [[3,100],[8,65],[14,40],[20,15]]),
  cv:      v => lerpMap(v, [[10,25],[15,45],[25,75],[30,100]]),
  sym:     v => lerpMap(v, [[1,100],[4,60],[8,35],[12,10]]),
  ce:      v => lerpMap(v, [[96,15],[97.5,45],[98.5,70],[99.2,100]]),
};
const ST = { good:{label:'良好', rank:2}, warn:{label:'需注意', rank:1}, crit:{label:'建議更換', rank:0} };
const STATE = { chg:'充電中', dis:'放電中', idle:'靜置', off:'離線' };
const ICON = {
  chg:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
  dis:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14M6 12l6 6 6-6"/></svg>',
  idle:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>',
  off:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2.4-1.7M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8a15 15 0 0 0-11-3.7M12 20h.01"/></svg>',
};
const ACTIONS = {
  cap:     {sig:'容量衰退',     act:'排程更換電池模組；更換前避免用於長時間行動任務',          due:'立即'},
  ir:      {sig:'內阻上升',     act:'安排內阻複測與熱插拔接點檢查，列入下次維護週期優先觀察', due:'7 天內'},

  const minK = IND.reduce((a, i) => subs[i.k] < subs[a] ? i.k : a, 'cap');

}

  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || '')}">`;
  (o.yTicks || []).forEach(v => { s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:${grid};stroke-width:1"/><text x="${m.l - 6}" y="${Y(v) + 3.5}" text-anchor="end" style="fill:${ink3}">${o.yFmt ? o.yFmt(v) : v}</text>`; });

  (o.thresholds || []).forEach(t => { s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t.y)}" y2="${Y(t.y)}" style="stroke:${t.color};stroke-width:1.5;stroke-dasharray:5 4"/><text x="${W - m.r}" y="${Y(t.y) - 5}" text-anchor="end" style="fill:${t.color};font-weight:600">${esc(t.label)}</text>`; });

function histogram(el, mods){
  const bins = []; for (let b = 30; b < 100; b += 5) bins.push({lo:b, hi:b + 5, n:0});
  mods.forEach(m => { const b = bins.find(x => m.score >= x.lo && m.score < x.hi) || (m.score >= 100 ? bins[bins.length - 1] : bins[0]); b.n++; });
  const W = Math.max(260, el.clientWidth || 500), H = 200, ml = 30, mr = 8, mt = 12, mb = 24, iw = W - ml - mr, ih = H - mt - mb;
  const mx = Math.max(...bins.map(b => b.n)), top = Math.ceil(mx / 5) * 5 || 5;
  const bw = iw / bins.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="健康分數分布直方圖">`;
  [0, top / 2, top].forEach(v => { const y = mt + ih - v / top * ih; s += `<line x1="${ml}" x2="${W - mr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${ml - 6}" y="${y + 3.5}" text-anchor="end">${v}</text>`; });
  bins.forEach((b, i) => {
    const h = b.n / top * ih, x = ml + i * bw + 1, y = mt + ih - h;
    const col = b.lo >= 60 ? 'var(--good)' : b.lo >= 40 ? 'var(--warn)' : 'var(--crit)';
    if (b.n) s += `<path d="M${x} ${mt + ih}V${y + 4}q0 -4 4 -4h${bw - 10}q4 0 4 4V${mt + ih}Z" style="fill:${col}" data-tip="<b>分數 ${b.lo}–${b.hi - 1}</b><br>${b.n} 個模組"/>`;
    if (i % 2 === 0) s += `<text x="${ml + i * bw}" y="${H - 6}" text-anchor="middle">${b.lo}</text>`;
  });
  [40, 60].forEach(t => { const x = ml + (t - 30) / 5 * bw; s += `<line x1="${x}" x2="${x}" y1="${mt}" y2="${mt + ih}" style="stroke:var(--ink-2);stroke-dasharray:4 3"/><text x="${x + 4}" y="${mt + 8}" style="fill:var(--ink-2);font-weight:600">${t === 40 ? '建議更換 | 需注意' : '需注意 | 良好'}</text>`; });
  el.innerHTML = `<div class="chart">${s}</svg></div>`;
}

    const summary = `${m.id} 診斷摘要（${period}）\n判定：${ST[st].label}，健康分數 ${f0(m.score)}，SOH ${f1(m.raw.cap)}%\n主要訊號：${sigText(m)}\n建議處置：${m.action}`;
    return {title:`${m.id} 模組報告`, period, scope:m.id, html, charts, summary, events:evs, created, file:`${id}_${m.id}`};
  }
  // fleet report
  const days = []; for (let d = dA; d >= dB; d--) days.push(d);
  const series = days.map(d => fleetDay(d, mods));
  const sA = series[0], sB = series[series.length - 1];
  const evs = EVENTS.filter(e => e.ts >= a.getTime() && e.ts <= b.getTime() && mods.includes(MOD[e.mid]));
  const ec = {crit:0, warn:0, info:0}; evs.forEach(e => ec[e.sev]++);
  const atEnd = mods.map(m => ({m, st:statusAt(m, dB), sc:scoreAt(m, dB)})).filter(x => x.st !== 'good').sort((x, y) => ST[x.st].rank - ST[y.st].rank || x.sc - y.sc);
  const newIn = mods.filter(m => m.status !== 'good' && m.since <= dA && m.since >= dB);
  const wos = WOS.filter(w => mods.includes(MOD[w.mid]) && ((w.created >= a.getTime() && w.created <= b.getTime()) || (w.done && w.done >= a.getTime() && w.done <= b.getTime())));
  const sig = {}; evs.filter(e => e.sev !== 'info' && ACTIONS[e.type]).forEach(e => sig[e.type] = (sig[e.type] || 0) + 1);
  const sigArr = Object.entries(sig).sort((x, y) => y[1] - x[1]); const sigMax = Math.max(1, ...sigArr.map(x => x[1]));
  const delta = sB.avg - sA.avg;
  const summaryLines = [
    `期末平均健康分數 ${f1(sB.avg)}，較期初 ${delta >= 0 ? '上升' : '下降'} ${f1(Math.abs(delta))} 分。`,
    `期末判定：良好 ${sB.good}、需注意 ${sB.warn}、建議更換 ${sB.crit}（共 ${mods.length} 個模組）。`,
    `期間新增 ${newIn.length} 個需處理模組，共 ${evs.length} 筆事件（嚴重 ${ec.crit}、警告 ${ec.warn}）。`,
    atEnd.filter(x => x.st === 'crit').length ? `需立即處置：${atEnd.filter(x => x.st === 'crit').map(x => x.m.id).join('、')}。` : '期末無需立即更換的模組。',
    sig.soc ? `電量計飄移為最常見訊號之一（${sig.soc} 筆）；電池本體指標正常，建議以完整放電＋靜置校準處理。` : '',
  ].filter(Boolean);
  let html = `<article class="report">${head('EPB-1001 電池機隊健康與維護報告', 'HID-2340 醫療平板・EPB-1001 雙模組 NMC 電池擴充盒')}`;
  if (secs.summary) html += `<h2>執行摘要</h2><div class="rk"><div><small>期末平均健康分數</small><b>${f1(sB.avg)}</b><em>${delta >= 0 ? '▲' : '▼'} ${f1(Math.abs(delta))} vs 期初</em></div><div><small>建議更換</small><b>${sB.crit}</b><em>期初 ${sA.crit}</em></div><div><small>需注意</small><b>${sB.warn}</b><em>期初 ${sA.warn}</em></div><div><small>警示事件</small><b>${ec.crit + ec.warn}</b><em>嚴重 ${ec.crit}・警告 ${ec.warn}</em></div></div><ul>${summaryLines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>`;
  if (secs.trend) html += `<h2>健康分數趨勢<span>每日平均</span></h2><div id="rc-trend"></div>`;
  if (secs.status) html += `<h2>狀態分布與院區比較<span>期末</span></h2><table><thead><tr><th>院區</th><th>模組數</th><th>平均分數</th><th>良好</th><th>需注意</th><th>建議更換</th></tr></thead><tbody>${SITES.filter(s => site === 'all' || s.id === site).map(s => { const sm = mods.filter(m => m.site === s.id), x = fleetDay(dB, sm); return `<tr><td>${s.name}</td><td>${sm.length}</td><td>${f1(x.avg)}</td><td>${x.good}</td><td>${x.warn}</td><td>${x.crit}</td></tr>`; }).join('')}</tbody></table>`;
  if (secs.issues) html += `<h2>異常訊號統計<span>警告與嚴重事件，依訊號類型</span></h2>${sigArr.length ? sigArr.map(([k, n]) => `<div class="hbar"><span>${ACTIONS[k].sig}</span><span><i style="width:${n / sigMax * 100}%"></i></span><span>${n}</span></div>`).join('') : '<p>此期間沒有警告或嚴重事件。</p>'}`;
  if (secs.queue) html += `<h2>維護優先清單<span>期末需處理模組 ${atEnd.length} 個</span></h2>${atEnd.length ? `<table><thead><tr><th>#</th><th>模組</th><th>位置</th><th>分數</th><th>判定</th><th>主要訊號</th><th>建議處置</th><th>時限</th></tr></thead><tbody>${atEnd.map((x, i) => `<tr><td>${i + 1}</td><td class="mono">${x.m.id}</td><td>${esc(mLoc(x.m))}</td><td>${f0(x.sc)}</td><td><span class="tg ${x.st}">${ST[x.st].label}</span></td><td>${esc(sigText(x.m))}</td><td>${esc(x.m.action)}</td><td>${esc(x.m.due)}</td></tr>`).join('')}</tbody></table>` : '<p>期末沒有需處理的模組。</p>'}`;
  if (secs.wo) html += `<h2>工單執行紀錄<span>${wos.length} 張</span></h2>${wos.length ? `<table><thead><tr><th>工單</th><th>模組</th><th>處置內容</th><th>建立</th><th>完成</th><th>狀態</th></tr></thead><tbody>${wos.map(w => `<tr><td class="mono">${w.id}</td><td class="mono">${w.mid}</td><td>${esc(w.act)}</td><td>${fmtDate(new Date(w.created))}</td><td>${w.done ? fmtDate(new Date(w.done)) : '—'}</td><td>${w.status}</td></tr>`).join('')}</tbody></table>` : '<p>此期間沒有工單紀錄。</p>'}`;
  if (secs.alerts){ const top = evs.filter(e => e.sev !== 'info').slice(0, 20); html += `<h2>警示事件紀錄<span>顯示最新 ${top.length} 筆警告／嚴重事件，完整紀錄請下載 CSV</span></h2>${top.length ? `<table><thead><tr><th>時間</th><th>模組</th><th>等級</th><th>內容</th></tr></thead><tbody>${top.map(e => `<tr><td style="white-space:nowrap">${fmtDate(new Date(e.ts))}</td><td class="mono">${e.mid}</td><td>${e.sev === 'crit' ? '嚴重' : '警告'}</td><td>${esc(e.msg)}</td></tr>`).join('')}</tbody></table>` : '<p>此期間沒有警告或嚴重事件。</p>'}`; }
  if (secs.method) html += `<h2>方法論與限制</h2><p>七項指標（容量衰退、內阻代理值、熱行為、SOC 一致性、充電終止曲線、雙模組對稱性、庫倫效率）各轉為 0–100 健康子分數並加權為綜合分數：≥ 60 良好、40–59 需注意、&lt; 40 建議更換。硬性否決項（SOH &lt; 80%、峰溫 &gt; 45 °C、模組間顯著失衡、通訊中斷 &gt; 24 小時）任一觸發即判定建議更換。</p><ul><li>權重為暫定值，將隨循環數據與樣本數持續校準。</li><li>每模組僅一個溫度感測器、無單芯電壓；對稱性以 B1／B2 比較作為替代指標。</li><li>壽命外推目前僅約 30 次穩定循環，應視為範圍而非精準數字。</li></ul>`;
  html += foot + `</article>`;
  if (secs.trend) charts.push(() => { const el = $('#rc-trend'); if (!el) return; const vals = series.map(x => x.avg), lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1); const n = days.length; lineChart(el, {labels:days.map(d => fmtDate(new Date(now - d * DAY)).slice(5)), series:[{name:'平均健康分數', values:vals, color:'#0c6473'}], yMin:lo, yMax:hi, yTicks:[lo, Math.round((lo + hi) / 2), hi], h:190, ink:'#7a8a8d', grid:'#e3e9ea', surf:'#fff', tipFmt:f1, xTicks:n < 4 ? [...Array(n).keys()] : undefined, tipTitle:i => fmtDate(new Date(now - days[i] * DAY))}); });
  const summary = `誠屏 EPB-1001 電池機隊報告（${period}，${scope}）\n` + summaryLines.map(l => '・' + l).join('\n');
  return {title:'機隊健康與維護報告', period, scope, html, charts, summary, events:evs, created, file:`${id}_機隊報告`};
}
function exportHTML(rep){
  const body = $('#rprev').innerHTML;
  return `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(rep.title)} ${esc(rep.period)}</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px;background:#eef2f3}.report{margin:0 auto}.chart{position:relative}.chart svg{display:block;overflow:visible}.legend{display:none}@media print{body{background:#fff;padding:0}.report{border:0;box-shadow:none}}${$('#report-css').textContent}</style></head><body>${body}</body></html>`;
}

/* ============================================================
   Router + global events
   ============================================================ */
const PAGES = {
  overview:{t:'總覽', sub:() => `${scoped().length} 個 EPB-1001 電池模組即時狀態`, r:renderOverview},
  maintenance:{t:'維護', sub:() => '依嚴重度排序的維護清單與建議處置', r:renderMaintenance},
  batteries:{t:'電池列表', sub:() => '所有模組狀態明細，可搜尋、篩選與排序', r:renderBatteries},
  assistant:{t:'AI 助理', sub:() => '以自然語言查詢診斷結果並建立工單', r:renderAssistant},
  reports:{t:'報表', sub:() => '自訂時間區間產生機隊或單一模組報告', r:renderReports},
};
function route(){
  const h = location.hash.slice(1);
  S.route = PAGES[h] ? h : 'overview';
  $$('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + S.route));
  $$('#nav a').forEach(a => { if (a.dataset.r === S.route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#pgTitle').textContent = PAGES[S.route].t; $('#pgSub').textContent = PAGES[S.route].sub();
  hideTip();
  PAGES[S.route].r();
  $('#main').scrollTop = 0;
}
function updateBadge(){ const n = MODULES.filter(m => m.status === 'crit' && !openWO(m.id)).length; $('#navBadge').textContent = n || ''; $('#navBadge').style.display = n ? '' : 'none'; $('#navBadge').title = `${n} 個建議更換模組尚未建立工單`; }
window.addEventListener('hashchange', route);
SITES.forEach(s => $('#siteSel').insertAdjacentHTML('beforeend', `<option value="${s.id}">${s.name}</option>`));
$('#siteSel').addEventListener('change', e => { S.site = e.target.value; S.list.page = 1; $('#pgSub').textContent = PAGES[S.route].sub(); if (S.route !== 'assistant' && S.route !== 'reports') PAGES[S.route].r(); else if (S.route === 'reports'){ $('#rsite').value = S.site; S.rep.site = S.site; } });
document.addEventListener('click', e => {
  const wo = e.target.closest('[data-wo]');
  if (wo){ e.stopPropagation(); const w = createWO(wo.dataset.wo); toastMsg(`已建立工單 ${w.id}（${w.mid}）`); if (S.route === 'maintenance') renderMaintenance(); if (S.route === 'assistant') drawMsgs(); if (S.drawer === wo.dataset.wo) openDrawer(S.drawer); return; }
  const ask2 = e.target.closest('[data-ask]');
  if (ask2){ const id = ask2.dataset.ask; closeDrawer(); location.hash = 'assistant'; route(); ask(`請分析 ${id} 目前的狀況、原因與建議處置`); return; }
  const mr = e.target.closest('[data-modrep]');
  if (mr){ closeDrawer(); location.hash = 'reports'; route(); S.rep.type = 'module'; S.rep.mid = mr.dataset.modrep; $('#rtype').value = 'module'; $('#rmod').value = S.rep.mid; $('#rmodf').hidden = false; $('#rsecf').hidden = true; generate(); return; }
  if (e.target.closest('[data-reset]')){ $('#lreset').click(); return; }
  const op = e.target.closest('[data-open]');
  if (op){ openDrawer(op.dataset.open); return; }
  const go = e.target.closest('[data-go]');
  if (go){ if (go.dataset.tab) S.maint.tab = go.dataset.tab; if (go.dataset.status){ S.list.status = go.dataset.status; S.list.page = 1; } if (location.hash.slice(1) === go.dataset.go) route(); else location.hash = go.dataset.go; return; }
  const mt = e.target.closest('[data-mtab]');
  if (mt){ S.maint.tab = mt.dataset.mtab; renderMaintenance(); return; }
  const so = e.target.closest('[data-sort]');
  if (so){ const k = so.dataset.sort; if (S.list.sort === k) S.list.dir *= -1; else { S.list.sort = k; S.list.dir = ['score','soh','cycles'].includes(k) ? 1 : k === 't' ? -1 : 1; } renderBatteries(); return; }
  const pg = e.target.closest('[data-page]');
  if (pg && !pg.disabled){ S.list.page = Number(pg.dataset.page); renderBatteries(); return; }
  const rp = e.target.closest('[data-rep]');
  if (rp){ showReport(Number(rp.dataset.rep)); }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.route === 'overview') renderOverview(); else if (S.route === 'maintenance') renderMaintenance(); else if (S.route === 'reports' && S.curRep != null) showReport(S.curRep); }, 200); });

updateBadge();
$('#clock').textContent = new Date().toLocaleTimeString('zh-TW', {hour12:false});
route();
setInterval(tick, 2000);
</script>
