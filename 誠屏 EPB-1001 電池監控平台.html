<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>誠屏 EPB-1001 電池監控平台 · Avalue EPB-1001 Battery Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: fixed petrol sidebar + scrolling work area; summary tiles on top, detail below; one slide-in drawer per battery module. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f5f8f8; --ink:#0e1b1e; --ink-2:#465659; --ink-3:#6f8186;
  --line:#dbe3e5; --line-2:#c6d2d5;
  --accent:#0c6473; --accent-ink:#ffffff; --accent-soft:#e0eef0;
  --side:#0d2a31; --side-ink:#d3e6ea; --side-ink-2:#8eb0b7; --side-active:#174550;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --off:#8a979a;
  --good-soft:#e2f3e2; --warn-soft:#fff2d3; --crit-soft:#fbe4e4; --off-soft:#e9eeef;
  --good-ink:#096609; --warn-ink:#7f5300; --crit-ink:#a32323; --off-ink:#4f5d60;
  --s1:#2a78d6; --s2:#eb6834;
  --font:'IBM Plex Sans','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1113; --surface:#111a1d; --surface-2:#162226; --ink:#e5eef0; --ink-2:#a5b5b9; --ink-3:#7a8d92;
    --line:#213034; --line-2:#2c3e43;
    --accent:#47b4c3; --accent-ink:#04171b; --accent-soft:#12323a;
    --side:#07181c; --side-ink:#d3e6ea; --side-ink-2:#7fa1a8; --side-active:#123942;
    --good-soft:#12301a; --warn-soft:#3a2c0c; --crit-soft:#3b1717; --off-soft:#1c282b;
    --good-ink:#62d462; --warn-ink:#f7c14f; --crit-ink:#f28585; --off-ink:#a9b6b9;
    --s1:#3987e5; --s2:#d95926;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1113; --surface:#111a1d; --surface-2:#162226; --ink:#e5eef0; --ink-2:#a5b5b9; --ink-3:#7a8d92;
  --line:#213034; --line-2:#2c3e43;
  --accent:#47b4c3; --accent-ink:#04171b; --accent-soft:#12323a;
  --side:#07181c; --side-ink:#d3e6ea; --side-ink-2:#7fa1a8; --side-active:#123942;
  --good-soft:#12301a; --warn-soft:#3a2c0c; --crit-soft:#3b1717; --off-soft:#1c282b;
  --good-ink:#62d462; --warn-ink:#f7c14f; --crit-ink:#f28585; --off-ink:#a9b6b9;
  --s1:#3987e5; --s2:#d95926;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:12px;color:var(--side-ink-2)}
.brand .co{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border:1px solid rgba(255,255,255,.1);border-radius:8px;font-size:12px;color:var(--side-ink)}
.brand .co i{width:8px;height:8px;border-radius:50%;background:#3fd17d;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14px}
.nav a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff}
.nav a .badge{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;border-radius:10px;padding:0 7px;line-height:18px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--side-ink-2);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.demo-chip{display:inline-flex;align-items:center;gap:6px;border:1px dashed rgba(255,255,255,.25);border-radius:6px;padding:3px 8px;color:var(--side-ink);width:max-content}

.main{overflow-y:auto;height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.top h1{font-size:19px}
.top .sub{font-size:12.5px;color:var(--ink-3)}
.top .tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 11px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.live i{animation:none}*{transition:none!important}}
.sel,.inp{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;height:34px}
.inp{min-width:0}
.sel:hover,.inp:hover{border-color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
a.lnk,button.lnk{color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:2px;font-weight:500}

.view{display:none;padding:20px 24px 40px;flex-direction:column;gap:16px}
.view.on{display:flex}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-2{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>header{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card>header h2{font-size:15px}
.card>header .hint{font-size:12.5px;color:var(--ink-3)}
.card>header .r{margin-left:auto;display:flex;gap:8px;align-items:center}

.kpi{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:14px 16px 14px 18px}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line-2)}
.kpi.k-good::before{background:var(--good)} .kpi.k-warn::before{background:var(--warn)} .kpi.k-crit::before{background:var(--crit)} .kpi.k-acc::before{background:var(--accent)}
.kpi .lbl{font-size:12.5px;color:var(--ink-2)}
.kpi .val{font-size:28px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .val small{font-size:14px;color:var(--ink-3);font-weight:500;margin-left:2px}
.kpi .foot{font-size:12px;color:var(--ink-3)}
.kpi button.kpi-link{all:unset;cursor:pointer;position:absolute;inset:0;border-radius:var(--r)}
.kpi button.kpi-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.kpi:has(.kpi-link):hover{border-color:var(--line-2);background:var(--surface-2)}
.delta-down{color:var(--crit-ink)} .delta-up{color:var(--good-ink)}

/* status pills: shape + label, never color alone */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px 2px 8px;border-radius:20px;white-space:nowrap;line-height:18px}
.pill::before{content:"";width:8px;height:8px;flex:none}
.pill.good{background:var(--good-soft);color:var(--good-ink)} .pill.good::before{background:var(--good);border-radius:50%}
.pill.warn{background:var(--warn-soft);color:var(--warn-ink)} .pill.warn::before{background:var(--warn);clip-path:polygon(50% 0,100% 100%,0 100%);width:10px;height:9px}
.pill.crit{background:var(--crit-soft);color:var(--crit-ink)} .pill.crit::before{background:var(--crit);border-radius:1px}
.pill.off{background:var(--off-soft);color:var(--off-ink)} .pill.off::before{background:var(--off);border-radius:50%;box-shadow:inset 0 0 0 2px var(--off-soft)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.veto{background:var(--crit-soft);border-color:transparent;color:var(--crit-ink);font-weight:600}
.st-ic{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.st-ic svg{width:13px;height:13px;flex:none}
.st-ic.chg svg{fill:var(--s1);stroke:none} .st-ic.dis svg{fill:none;stroke:var(--s2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.st-ic.idle svg{fill:none;stroke:var(--ink-3);stroke-width:2.4;stroke-linecap:round} .st-ic.off svg{fill:none;stroke:var(--off);stroke-width:2;stroke-linecap:round}

/* priority risk list */
.risk{display:flex;flex-direction:column}
.risk li{list-style:none;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.risk li:first-child{border-top:0}
.risk .rk{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;text-align:center}
.risk .t{display:flex;flex-direction:column;min-width:0}
.risk .t b{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.risk .t span{font-size:12.5px;color:var(--ink-2)}
ul.risk{margin:0;padding:0}

/* distribution bar */
.dist{display:flex;height:26px;gap:2px;border-radius:6px;overflow:hidden}
.dist>div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;min-width:22px}
.dist .d-good{background:var(--good)} .dist .d-warn{background:var(--warn);color:#3b2800} .dist .d-crit{background:var(--crit)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.site-rows{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.site-row{display:grid;grid-template-columns:92px minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px}
.site-row .dist{height:14px;border-radius:4px}
.site-row .dist>div{font-size:0;min-width:3px}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ops div{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.ops b{font-size:20px;font-variant-numeric:tabular-nums;font-weight:600}
.sect-lbl{font-size:12px;color:var(--ink-3);margin:14px 0 8px;font-weight:500}

/* battery wall */
.wall-site{display:flex;flex-direction:column;gap:8px}
.wall-site+.wall-site{margin-top:16px}
.wall-site h3{font-size:13px;color:var(--ink-2);font-weight:600;display:flex;gap:8px;align-items:baseline}
.wall-site h3 span{font-weight:400;color:var(--ink-3)}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.dev{border:1px solid var(--line);border-radius:8px;padding:7px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.dev .dh{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink-3);padding:0 2px}
.dev .dh b{color:var(--ink);font-family:var(--mono);font-weight:500}
.dev .dh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mods{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mod{all:unset;cursor:pointer;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 9px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mod:hover{border-color:var(--ink-3)}
.mod:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mod::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--good)}
.mod.warn::before{background:var(--warn)} .mod.crit::before{background:var(--crit)}
.mod .mt{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-3)}
.mod .mt .shape{width:8px;height:8px;background:var(--good);border-radius:50%}
.mod.warn .mt .shape{background:var(--warn);border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);width:9px}
.mod.crit .mt .shape{background:var(--crit);border-radius:1px}
.mod .soc{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.mod .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.mod .bar i{display:block;height:100%;background:var(--ink-3);border-radius:2px}
.mod .mb{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mod.offl .soc{color:var(--ink-3)}

/* alerts feed */
.feed{display:flex;flex-direction:column;margin:0;padding:0}
.feed li{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:9px 2px;border-top:1px solid var(--line);align-items:start;font-size:13px}
.feed li:first-child{border-top:0}
.feed .when{font-size:12px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.sev{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700}
.sev.crit{background:var(--crit-soft);color:var(--crit-ink)} .sev.warn{background:var(--warn-soft);color:var(--warn-ink)} .sev.info{background:var(--accent-soft);color:var(--accent)}
.feed .new{animation:flash 1.6s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--ink-3);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
th button:focus-visible{outline:2px solid var(--accent)}
th[aria-sort] button{color:var(--ink)}
.scorebar{display:flex;align-items:center;gap:8px;min-width:120px}
.scorebar .trk{flex:1;height:6px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}
.scorebar .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.scorebar b{font-variant-numeric:tabular-nums;width:24px;text-align:right;font-weight:600}
.socbar{display:flex;align-items:center;gap:6px;min-width:84px}
.socbar .trk{width:44px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.socbar .trk i{display:block;height:100%;background:var(--ink-3)}
.idcell{font-family:var(--mono);font-weight:500;white-space:nowrap}
.sub2{font-size:12px;color:var(--ink-3)}

/* toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1 1 220px;max-width:320px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-3);fill:none;stroke-width:2}
.search input{width:100%;padding-left:32px}
.count{font-size:12.5px;color:var(--ink-3);margin-left:auto}
.pager{display:flex;gap:4px;align-items:center;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.pager button{min-width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.pager button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;height:30px;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,15,18,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.drawer .dhd{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:flex-start}
.drawer .dhd h2{font-size:18px;font-family:var(--mono);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drawer .dhd .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.drawer .dbody{overflow-y:auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:14px}
.x{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.x svg{width:16px;height:16px;stroke:var(--ink-2);stroke-width:2;fill:none;stroke-linecap:round}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.bigscore{display:flex;flex-direction:column;align-items:center;justify-content:center;width:92px;height:92px;border-radius:50%;border:6px solid var(--good)}
.bigscore.warn{border-color:var(--warn)} .bigscore.crit{border-color:var(--crit)}
.bigscore b{font-size:28px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.bigscore span{font-size:11px;color:var(--ink-3)}
.action{border-radius:8px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.action.warn{background:var(--warn-soft);border-color:transparent} .action.crit{background:var(--crit-soft);border-color:transparent}
.action b{font-weight:600}
.lt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lt .tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.lt .tile .lbl{font-size:12px;color:var(--ink-3)}
.lt .tile .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.lt .tile .v small{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:4px}
.ind{display:flex;flex-direction:column}
.ind .row{display:grid;grid-template-columns:110px minmax(0,1fr) 96px 30px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.ind .row:first-child{border-top:0}
.ind .row .raw{font-size:12.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.ind .row .trk{height:8px;background:var(--line);border-radius:4px;position:relative}
.ind .row .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.ind .row .trk em{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-3);opacity:.6}
.ind .row b{text-align:right;font-variant-numeric:tabular-nums}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dcard h3{font-size:13.5px;margin-bottom:10px;display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap}
html[lang="en"] .site-row{grid-template-columns:190px minmax(0,1fr) 74px}
html[lang="en"] .ind .row{grid-template-columns:150px minmax(0,1fr) 96px 30px}
.dcard h3 span{font-weight:400;font-size:12px;color:var(--ink-3)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* chart bits */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:7px;max-width:260px;opacity:0;transition:opacity .08s;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#tip.on{opacity:1}
#tip b{font-weight:600}
#tip .tr{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
#tip .tr i{width:8px;height:8px;border-radius:2px;flex:none}

/* chat */
.chatwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;min-height:calc(100vh - 140px)}
.chat{display:flex;flex-direction:column;padding:0;overflow:hidden;min-height:560px}
.chat .chd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat .chd h2{font-size:15px}
.aistat{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.aistat i{width:8px;height:8px;border-radius:50%;background:var(--good)}
.aistat.offline i{background:var(--off)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;background:var(--surface-2)}
.msg{max-width:min(640px,88%);display:flex;flex-direction:column;gap:6px}
.msg .bub{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6}
.msg.u{align-self:flex-end}
.msg.u .bub{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .who{font-size:11.5px;color:var(--ink-3)}
.msg.u .who{text-align:right}
.bub p{margin:0 0 6px}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:4px 0 6px;padding-left:20px}
.bub li{margin:2px 0}
.bub code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:0 4px;border-radius:4px}
.mchip{all:unset;cursor:pointer;font-family:var(--mono);font-size:.92em;font-weight:500;color:var(--accent);background:var(--accent-soft);padding:0 5px;border-radius:4px}
.mchip:hover{text-decoration:underline}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--ink-3);font-size:13px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--surface);align-items:flex-end}
.composer textarea{flex:1;resize:none;min-height:42px;max-height:140px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface)}
.qp{display:flex;flex-direction:column;gap:6px}
.qp button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink)}
.qp button:hover{border-color:var(--accent);color:var(--accent)}
.sw-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.sw-row:first-of-type{border-top:0}
.sw-row span{display:flex;flex-direction:column}
.sw-row small{color:var(--ink-3);font-size:12px}
.toggle{appearance:none;width:36px;height:20px;border-radius:10px;background:var(--line-2);position:relative;flex:none;cursor:pointer;margin-top:2px}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{left:18px}

/* reports */
.repwrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.fld>.lb{font-size:12.5px;color:var(--ink-2);font-weight:500}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px}
.presets button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.dates{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.dates span{color:var(--ink-3);font-size:12px}
.checks{display:flex;flex-direction:column;gap:6px;font-size:13px}
.checks label{display:flex;gap:8px;align-items:center}
.err{color:var(--crit-ink);font-size:12.5px}
.replist{display:flex;flex-direction:column;gap:4px;margin:0;padding:0}
.replist li{list-style:none}
.replist button{all:unset;cursor:pointer;display:flex;flex-direction:column;padding:7px 8px;border-radius:6px;width:calc(100% - 16px);font-size:12.5px}
.replist button:hover{background:var(--surface-2)}
.replist small{color:var(--ink-3)}
.repbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.repbar .note{font-size:12.5px;color:var(--ink-3);margin-left:auto}
</style>

.report .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:.92em}

<script>
'use strict';
/* ============================================================
   Language
   ============================================================ */
let LANG = (() => { try { return localStorage.getItem('bai-lang') === 'en' ? 'en' : 'zh'; } catch { return 'zh'; } })();
const L = (zh, en) => LANG === 'en' ? en : zh;
const LX = o => o == null ? '' : typeof o === 'string' ? o : (LANG === 'en' ? o.en : o.zh);

/* ============================================================
   Utilities
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(20261109);
const rand = (a, b) => a + R() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f0 = v => Math.round(v).toString();
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const f2 = v => (Math.round(v * 100) / 100).toFixed(2);
function lerpMap(v, pts){
  if (v <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++){
    if (v <= pts[i][0]){ const [x0, y0] = pts[i-1], [x1, y1] = pts[i]; return y0 + (y1 - y0) * (v - x0) / (x1 - x0); }
  }
  return pts[pts.length - 1][1];
}
const NOW0 = new Date();
const DAY = 864e5;
const pad2 = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())}`;
const fmtDT = d => `${pad2(d.getMonth()+1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
function ago(ts){
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return L('剛剛', 'just now');
  if (s < 3600) return L(`${Math.floor(s/60)} 分鐘前`, `${Math.floor(s/60)} min ago`);
  if (s < 86400) return L(`${Math.floor(s/3600)} 小時前`, `${Math.floor(s/3600)} h ago`);
  return L(`${Math.floor(s/86400)} 天前`, `${Math.floor(s/86400)} d ago`);
}
const startOfDay = d => { const x = new Date(d); x.setHours(0,0,0,0); return x; };
const csvRow = r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',');

/* ============================================================
   Domain model — EPB-1001 dual-module NMC pack on HID-2340
   ============================================================ */
const RATED_AH = 6.46;
const W = (zh, en) => ({zh, en});
const SITES = [
  {id:'A', name:W('北區醫學中心','Northern Medical Center'), short:W('北區','North'), amb:26, n:16, wards:[W('急診部','Emergency'),W('加護病房 ICU','ICU'),W('手術室','Operating Room'),W('7F 內科病房','7F Internal Med.'),W('門診護理站','Outpatient Nursing')]},
  {id:'B', name:W('中區教學醫院','Central Teaching Hospital'), short:W('中區','Central'), amb:27, n:14, wards:[W('急診部','Emergency'),W('10F 外科病房','10F Surgical Ward'),W('血液透析室','Hemodialysis'),W('產房','Delivery Room'),W('藥劑部','Pharmacy')]},
  {id:'C', name:W('南區區域醫院','Southern Regional Hospital'), short:W('南區','South'), amb:28, n:10, wards:[W('急診部','Emergency'),W('加護病房 ICU','ICU'),W('5F 綜合病房','5F General Ward'),W('復健科','Rehabilitation')]},
];
const SITE = Object.fromEntries(SITES.map(s => [s.id, s]));
/* Six scored indicators. SOH (capacity) is shown for reference only and never drives a verdict:
   replacement timing on capacity alone stays the customer's decision. */
const IND = [
  {k:'ir',      name:W('內阻代理值','Resistance proxy'),       w:.24, fmt:v=>f0(v)+' mΩ', desc:W('靜置與負載電壓差 ÷ 負載電流','(rest V − load V) ÷ load current')},
  {k:'thermal', name:W('熱行為','Thermal behaviour'),          w:.22, fmt:v=>f1(v)+' °C', desc:W('充放電峰值溫度','Peak temperature during charge/discharge')},
  {k:'soc',     name:W('SOC 一致性','SOC consistency'),        w:.12, fmt:v=>(v>=0?'+':'')+f1(v)+' pt', desc:W('BMS SOC 對比獨立庫倫計數','BMS SOC vs independent coulomb count')},
  {k:'cv',      name:W('充電終止曲線','Charge termination'),   w:.14, fmt:v=>'CV '+f0(v)+L(' 分',' min'), desc:W('CC→CV 收斂時間（正常 35–38 分）','CC→CV convergence time (normal 35–38 min)')},
  {k:'sym',     name:W('雙模組對稱性','Module symmetry'),      w:.12, fmt:v=>f1(v)+'%', desc:W('B1／B2 電流分配差異','B1/B2 current-split difference')},
  {k:'ce',      name:W('庫倫效率','Coulombic efficiency'),     w:.16, fmt:v=>f1(v)+'%', desc:W('放電 Ah ÷ 充電 Ah','Discharge Ah ÷ charge Ah')},
];
const INDK = Object.fromEntries(IND.map(i => [i.k, i]));
const SUB = {
  ir:      v => lerpMap(v, [[135,100],[160,60],[190,30],[220,5]]),
  thermal: v => lerpMap(v, [[37,100],[40,50],[43,25],[46,5]]),          // >40 °C → service, >43 °C → veto
  soc:     v => lerpMap(Math.abs(v), [[3,100],[8,65],[14,40],[20,15]]),
  cv:      v => lerpMap(v, [[10,25],[15,45],[25,75],[30,100]]),
  sym:     v => lerpMap(v, [[1,100],[4,60],[8,35],[12,10]]),
  ce:      v => lerpMap(v, [[96,15],[97.5,45],[98.5,70],[99.2,100]]),
};
const ST = { good:{label:W('良好','Good'), rank:2}, warn:{label:W('需要保養','Service due'), rank:1}, crit:{label:W('建議更換','Replace advised'), rank:0} };
const stLabel = s => LX(ST[s].label);
const STATE = { chg:W('充電中','Charging'), dis:W('放電中','Discharging'), idle:W('靜置','Idle'), off:W('離線','Offline') };
const stateLabel = s => LX(STATE[s]);
const ICON = {
  chg:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
  dis:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14M6 12l6 6 6-6"/></svg>',
  idle:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>',
  off:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2.4-1.7M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8a15 15 0 0 0-11-3.7M12 20h.01"/></svg>',
};
const ACTIONS = {
  ir:      {sig:W('內阻上升','Resistance rising'),     act:W('安排內阻複測與熱插拔接點檢查，列入下次保養週期優先觀察','Re-test resistance and inspect hot-swap contacts; prioritise at next service'), due:W('7 天內','Within 7 days')},
  thermal: {sig:W('溫度上升','Temperature rise'),      act:W('立即檢查充電器與機殼通風，暫停於高溫環境充電','Inspect charger and enclosure ventilation now; stop charging in hot locations'), due:W('48 小時內','Within 48 h')},
  soc:     {sig:W('電量計飄移','Gauge drift'),          act:W('電池本體良好；執行完整充放電並靜置 2 小時以上，讓電量計重新學習 FCC','Cells are healthy; run a full charge/discharge and rest 2 h+ so the gauge relearns FCC'), due:W('下次充電週期','Next charge cycle')},
  cv:      {sig:W('充電終止異常','Abnormal charge termination'), act:W('檢查充電器 CV 參數與連接器，複測一次完整充電','Check charger CV settings and connector; re-test one full charge'), due:W('7 天內','Within 7 days')},
  sym:     {sig:W('雙模組失衡','Module imbalance'),     act:W('檢查熱插拔接點與 B1／B2 配對，必要時成對更換','Inspect hot-swap contacts and B1/B2 pairing; replace as a pair if needed'), due:W('48 小時內','Within 48 h')},
  ce:      {sig:W('庫倫效率偏低','Low coulombic efficiency'), act:W('疑似自放電或副反應，安排檢測並追蹤 3 個循環','Possible self-discharge or side reaction; inspect and track 3 cycles'), due:W('7 天內','Within 7 days')},

  });

  s += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" style="fill:transparent"/></svg>`;
  el.innerHTML = `<div class="chart">${s}</div>`;
  const svg = el.querySelector('svg'), xh = svg.querySelector('.xh');
  svg.addEventListener('mousemove', e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * Wd / r.width;

function spark(vals, color, w = 120, h = 30){
  if (!vals.length) return '';
  let mn = Math.min(...vals), mx = Math.max(...vals); if (mx - mn < 1e-6){ mx += .5; mn -= .5; }
  const pts = vals.map((v, i) => [(i / (vals.length - 1)) * w, h - 3 - (v - mn) / (mx - mn) * (h - 6)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const lp = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${w} ${h}L0 ${h}Z" style="fill:${color};opacity:.12"/><path d="${d}" style="fill:none;stroke:${color};stroke-width:1.6" vector-effect="non-scaling-stroke"/><circle cx="${lp[0]}" cy="${lp[1]}" r="2.5" style="fill:${color}"/></svg>`;
}

function histogram(el, mods){
  const bins = []; for (let b = 30; b < 100; b += 5) bins.push({lo:b, hi:b + 5, n:0});
  mods.forEach(m => { const b = bins.find(x => m.score >= x.lo && m.score < x.hi) || (m.score >= 100 ? bins[bins.length - 1] : bins[0]); b.n++; });
  const Wd = Math.max(260, el.clientWidth || 500), H = 200, ml = 30, mr = 8, mt = 14, mb = 24, iw = Wd - ml - mr, ih = H - mt - mb;
  const mx = Math.max(...bins.map(b => b.n)), top = Math.ceil(mx / 5) * 5 || 5;
  const bw = iw / bins.length;
  let s = `<svg viewBox="0 0 ${Wd} ${H}" width="100%" height="${H}" role="img" aria-label="${L('健康分數分布直方圖', 'Health score histogram')}">`;
  [0, top / 2, top].forEach(v => { const y = mt + ih - v / top * ih; s += `<line x1="${ml}" x2="${Wd - mr}" y1="${y}" y2="${y}" style="stroke:var(--line)"/><text x="${ml - 6}" y="${y + 3.5}" text-anchor="end">${v}</text>`; });
  bins.forEach((b, i) => {
    const h = b.n / top * ih, x = ml + i * bw + 1, y = mt + ih - h;
    const col = b.lo >= 60 ? 'var(--good)' : b.lo >= 40 ? 'var(--warn)' : 'var(--crit)';
    if (b.n) s += `<path d="M${x} ${mt + ih}V${y + 4}q0 -4 4 -4h${Math.max(0, bw - 10)}q4 0 4 4V${mt + ih}Z" style="fill:${col}" data-tip="<b>${L('分數', 'Score')} ${b.lo}–${b.hi - 1}</b><br>${L(`${b.n} 個模組`, `${b.n} modules`)}"/>`;
    if (i % 2 === 0) s += `<text x="${ml + i * bw}" y="${H - 6}" text-anchor="middle">${b.lo}</text>`;
  });
  [40, 60].forEach(t => { const x = ml + (t - 30) / 5 * bw; s += `<line x1="${x}" x2="${x}" y1="${mt}" y2="${mt + ih}" style="stroke:var(--ink-2);stroke-dasharray:4 3"/><text x="${x + 4}" y="${mt + 8}" style="fill:var(--ink-2);font-weight:600">${t === 40 ? `${stLabel('crit')} | ${stLabel('warn')}` : `${stLabel('warn')} | ${stLabel('good')}`}</text>`; });
  el.innerHTML = `<div class="chart">${s}</svg></div>`;
}

function listRows(){
  const Ls = S.list, q = Ls.q.trim().toLowerCase();
  const rows = scoped().filter(m => {
    if (Ls.status !== 'all' && m.status !== Ls.status) return false;
    if (Ls.state !== 'all' && m.dev.state !== Ls.state) return false;
    if (Ls.sig !== 'all' && m.sigK !== Ls.sig) return false;
    if (q && !(`${m.id} ${m.serial} ${m.ward.zh} ${m.ward.en} ${SITE[m.site].name.zh} ${SITE[m.site].name.en} ${sigText(m)}`.toLowerCase().includes(q))) return false;
    return true;
  });
  const key = {id:m => m.id, loc:m => m.site + m.ward.en, status:m => ST[m.status].rank * 1000 - (BOOST[m.sigK] || 0) * 100 + m.score, score:m => m.score, soh:m => m.raw.cap, soc:m => m.live.bms, v:m => m.live.v, i:m => m.live.i, t:m => m.live.t, cycles:m => m.cycles, sig:m => m.sigK || 'zz', state:m => m.dev.state}[Ls.sort];
  rows.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * Ls.dir; });
  return rows;
}

   ============================================================ */
function live(){
  $$('[data-live]').forEach(el => {
    const k = el.dataset.live, m = MOD[el.dataset.mid];
    if (k.startsWith('ops-')){ const st = k.slice(4); el.textContent = scopedDev().filter(d => d.state === st).length; return; }
    if (k === 'online'){ el.textContent = scoped().filter(x => x.dev.offH === 0).length; return; }
    if (!m) return;
    const Lv = m.live, off = m.dev.state === 'off';
    if (k === 'soc') el.textContent = off ? '—' : f0(Lv.bms) + '%';
    else if (k === 'socbar'){ el.style.width = (off ? 0 : Lv.bms) + '%'; el.style.background = Lv.bms < 20 ? 'var(--s2)' : 'var(--ink-3)'; }
    else if (k === 'v') el.textContent = off ? '—' : f2(Lv.v) + ' V';
    else if (k === 'i') el.textContent = off ? '—' : (Lv.i >= 0 ? '+' : '') + f2(Lv.i) + ' A';
    else if (k === 't') el.textContent = off ? (el.dataset.compact ? f0((Date.now() - m.dev.lastSeen) / 3600e3) + L(' 小時', ' h') : ago(m.dev.lastSeen)) : f1(Lv.t) + '°C';
    else if (k === 'stateic'){ const key = m.dev.state + LANG; if (el.dataset.st !== key){ el.dataset.st = key; el.innerHTML = el.dataset.compact ? `<span class="st-ic ${m.dev.state}" title="${stateLabel(m.dev.state)}">${ICON[m.dev.state]}${m.dev.state === 'off' ? stateLabel('off') : ''}</span>` : stIc(m.dev.state); } }
  });
}

    const t2 = l.trim();

  });
  close(); return out;
}

  if (secs.issues) html += `<h2>${L('異常訊號統計', 'Signals by type')}<span>${L('警告與嚴重事件', 'warning and critical events')}</span></h2>${sigArr.length ? sigArr.map(([k, n]) => `<div class="hbar"><span>${LX(ACTIONS[k].sig)}</span><span><i style="width:${n / sigMax * 100}%"></i></span><span>${n}</span></div>`).join('') : `<p>${L('此期間沒有警告或嚴重事件。', 'No warning or critical events in this period.')}</p>`}`;
  if (secs.queue) html += `<h2>${L('維護優先清單', 'Service priority list')}<span>${L(`期末需處理模組 ${atEnd.length} 個`, `${atEnd.length} modules flagged at period end`)}</span></h2>${atEnd.length ? `<table><thead><tr><th>#</th><th>${L('模組', 'Module')}</th><th>${L('位置', 'Location')}</th><th>${L('分數', 'Score')}</th><th>${L('判定', 'Verdict')}</th><th>${L('主要訊號', 'Main signal')}</th><th>${L('建議處置', 'Recommended action')}</th><th>${L('時限', 'Due')}</th></tr></thead><tbody>${atEnd.map((x, i) => `<tr><td>${i + 1}</td><td class="mono">${x.m.id}</td><td>${esc(mLoc(x.m))}</td><td>${f0(x.sc)}</td><td>${tg(x.st)}</td><td>${esc(sigText(x.m))}</td><td>${esc(actText(x.m))}</td><td>${esc(dueText(x.m))}</td></tr>`).join('')}</tbody></table>` : `<p>${L('期末沒有需處理的模組。', 'No modules flagged at period end.')}</p>`}`;
  if (secs.wo) html += `<h2>${L('工單執行紀錄', 'Work order log')}<span>${L(`${wos.length} 張`, `${wos.length}`)}</span></h2>${wos.length ? `<table><thead><tr><th>${L('工單', 'Work order')}</th><th>${L('模組', 'Module')}</th><th>${L('處置內容', 'Action')}</th><th>${L('建立', 'Created')}</th><th>${L('完成', 'Closed')}</th><th>${L('狀態', 'Status')}</th></tr></thead><tbody>${wos.map(w => `<tr><td class="mono">${w.id}</td><td class="mono">${w.mid}</td><td>${esc(LX(w.act))}</td><td>${fmtDate(new Date(w.created))}</td><td>${w.done ? fmtDate(new Date(w.done)) : '—'}</td><td>${LX(WOST[w.status])}</td></tr>`).join('')}</tbody></table>` : `<p>${L('此期間沒有工單紀錄。', 'No work orders in this period.')}</p>`}`;
  if (secs.alerts){ const top = evs.filter(e => e.sev !== 'info').slice(0, 20); html += `<h2>${L('警示事件紀錄', 'Alert log')}<span>${L(`最新 ${top.length} 筆警告／嚴重事件，完整紀錄請下載 CSV`, `latest ${top.length} warning/critical events; download the CSV for the full log`)}</span></h2>${top.length ? `<table><thead><tr><th>${L('時間', 'Time')}</th><th>${L('模組', 'Module')}</th><th>${L('等級', 'Level')}</th><th>${L('內容', 'Detail')}</th></tr></thead><tbody>${top.map(e => `<tr><td style="white-space:nowrap">${fmtDate(new Date(e.ts))}</td><td class="mono">${e.mid}</td><td>${sevLabel(e.sev)}</td><td>${esc(LX(e.msg))}</td></tr>`).join('')}</tbody></table>` : `<p>${L('此期間沒有警告或嚴重事件。', 'No warning or critical events in this period.')}</p>`}`; }
  if (secs.method) html += `<h2>${L('方法論與限制', 'Method and limitations')}</h2>${methodTxt}`;
  html += foot + `</article>`;
  if (secs.trend) charts.push(() => { const el = $('#rc-trend'); if (!el) return; const vals = series.map(x => x.avg), lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1); const n = days.length; lineChart(el, {labels:days.map(d => fmtDate(new Date(now - d * DAY)).slice(5)), series:[{name:L('平均健康分數', 'Average health score'), values:vals, color:'#0c6473'}], yMin:lo, yMax:hi, yTicks:[lo, Math.round((lo + hi) / 2), hi], h:190, ink:'#7a8a8d', grid:'#e3e9ea', surf:'#fff', tipFmt:f1, xTicks:n < 4 ? [...Array(n).keys()] : undefined, tipTitle:i => fmtDate(new Date(now - days[i] * DAY))}); });
  const summary = L(`誠屏 EPB-1001 電池機隊報告（${period}，${scope}）\n`, `Avalue EPB-1001 battery fleet report (${period}, ${scope})\n`) + summaryLines.map(l => '・' + l).join('\n');
  return {title:L('機隊健康與維護報告', 'Fleet health and service report'), period, scope, html, charts, summary, events:evs, created, file:`${id}_${L('機隊報告', 'fleet_report')}`};
}
function exportHTML(rep){
  const body = $('#rprev').innerHTML;
  return `<!DOCTYPE html><html lang="${LANG === 'en' ? 'en' : 'zh-Hant'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(rep.title)} ${esc(rep.period)}</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px;background:#eef2f3}.report{margin:0 auto}.chart{position:relative}.chart svg{display:block;overflow:visible}@media print{body{background:#fff;padding:0}.report{border:0;box-shadow:none}}${$('#report-css').textContent}</style></head><body>${body}</body></html>`;
}

/* ============================================================
   Router + global events
   ============================================================ */
function route(){
  const h = location.hash.slice(1);
  S.route = PAGES[h] ? h : 'overview';
  $$('.view').forEach(v => { v.classList.toggle('on', v.id === 'v-' + S.route); v.setAttribute('aria-label', LX(PAGES[v.id.slice(2)].t)); });
  $$('#nav a').forEach(a => { if (a.dataset.r === S.route) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  $('#pgTitle').textContent = LX(PAGES[S.route].t); $('#pgSub').textContent = PAGES[S.route].sub();
  hideTip();
  PAGES[S.route].r();
  $('#main').scrollTop = 0;
}
function setLang(l){
  if (l === LANG) return;
  LANG = l; try { localStorage.setItem('bai-lang', l); } catch {}
  ['v-batteries','v-assistant','v-reports'].forEach(id => { const v = $('#' + id); v.innerHTML = ''; delete v.dataset.built; });
  S.reports = S.reports.map(r => ({params:r.params, ...buildReport(r.params, r.created)}));
  renderChrome();
  const keepScroll = $('#main').scrollTop;
  route(); $('#main').scrollTop = keepScroll;
  if (S.drawer) openDrawer(S.drawer);
}
window.addEventListener('hashchange', route);
$('#siteSel').addEventListener('change', e => { S.site = e.target.value; S.list.page = 1; $('#pgSub').textContent = PAGES[S.route].sub(); if (S.route !== 'assistant' && S.route !== 'reports') PAGES[S.route].r(); else if (S.route === 'reports'){ $('#rsite').value = S.site; S.rep.site = S.site; } });
document.addEventListener('click', e => {
  const lg = e.target.closest('[data-lang]');
  if (lg){ setLang(lg.dataset.lang); return; }
  const wo = e.target.closest('[data-wo]');
  if (wo){ e.stopPropagation(); const w = createWO(wo.dataset.wo); toastMsg(L(`已建立工單 ${w.id}（${w.mid}）`, `Work order ${w.id} created (${w.mid})`)); if (S.route === 'maintenance') renderMaintenance(); if (S.route === 'assistant') drawMsgs(); if (S.drawer === wo.dataset.wo) openDrawer(S.drawer); return; }
  const ask2 = e.target.closest('[data-ask]');
  if (ask2){ const id = ask2.dataset.ask; closeDrawer(); location.hash = 'assistant'; route(); ask(L(`請分析 ${id} 目前的狀況、原因與建議處置`, `Analyse ${id}: current condition, likely cause and recommended action`)); return; }
  const mr = e.target.closest('[data-modrep]');
  if (mr){ closeDrawer(); location.hash = 'reports'; route(); S.rep.type = 'module'; S.rep.mid = mr.dataset.modrep; $('#rtype').value = 'module'; $('#rmod').value = S.rep.mid; $('#rmodf').hidden = false; $('#rsecf').hidden = true; generate(); return; }
  if (e.target.closest('[data-reset]')){ $('#lreset').click(); return; }
  const op = e.target.closest('[data-open]');
  if (op){ openDrawer(op.dataset.open); return; }
  const go = e.target.closest('[data-go]');
  if (go){ if (go.dataset.tab) S.maint.tab = go.dataset.tab; if (go.dataset.status){ S.list.status = go.dataset.status; S.list.page = 1; } if (location.hash.slice(1) === go.dataset.go) route(); else location.hash = go.dataset.go; return; }
  const mt = e.target.closest('[data-mtab]');
  if (mt){ S.maint.tab = mt.dataset.mtab; renderMaintenance(); return; }
  const so = e.target.closest('[data-sort]');
  if (so){ const k = so.dataset.sort; if (S.list.sort === k) S.list.dir *= -1; else { S.list.sort = k; S.list.dir = k === 't' ? -1 : 1; } renderBatteries(); return; }
  const pg = e.target.closest('[data-page]');
  if (pg && !pg.disabled){ S.list.page = Number(pg.dataset.page); renderBatteries(); return; }
  const rp = e.target.closest('[data-rep]');
  if (rp){ showReport(Number(rp.dataset.rep)); }
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.route === 'overview') renderOverview(); else if (S.route === 'maintenance') renderMaintenance(); else if (S.route === 'reports' && S.curRep != null) showReport(S.curRep); }, 200); });

renderChrome();
$('#clock').textContent = new Date().toLocaleTimeString(LANG === 'en' ? 'en-GB' : 'zh-TW', {hour12:false});
route();
setInterval(tick, 2000);
</script>
